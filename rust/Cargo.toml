[package]
name = "tunner"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
bytes = "1.6"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "encryption", "rand_core"] }
sha2 = "0.10"
socket2 = "0.6"
base64 = "0.22"
ring = "0.17"

[[bin]]
name = "tunclient"
path = "src/bin/tunclient.rs"

[[bin]]
name = "tunserver"
path = "src/bin/tunserver.rs"

[lib]
name = "tunner"
path = "src/lib.rs"
